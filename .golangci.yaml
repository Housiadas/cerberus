version: "2"
linters:
  default: all
  enable:
    - wsl_v5
  disable:
    - wsl
    - funlen
    - mnd
    - varnamelen
    - depguard
    - ireturn
    - exhaustruct
    - gosec
    - gochecknoglobals
  settings:
    wsl_v5:
      allow-first-in-block: true
      allow-whole-block: false
      branch-max-lines: 2
  exclusions:
    generated: strict
    # Log a warning if an exclusion rule is unused.
    # Default: false
    warn-unused: true
    # Predefined exclusion rules.
    # Default: []
    presets:
      - comments
      - std-error-handling
      - common-false-positives
      - legacy
    # Excluding configuration per-path, per-linter, per-text and per-source.
    rules:
      # Exclude some linters from running on tests files.
      - path: _test\.go
        linters:
          - gocyclo
          - errcheck
          - dupl
          - gosec
      # Exclude revive var-naming for packages with underscores (project convention).
      - linters:
          - revive
        text: "var-naming: don't use an underscore in package name"
      # Exclude revive for context package name conflict.
      - linters:
          - revive
        text: "var-naming: avoid package names that conflict"
      # Exclude docs folder from linters (auto-generated by swaggo).
      - path: docs/
        linters:
          - gochecknoglobals
          - gochecknoinits
      # Run some linter only for test files by excluding its issues for everything else.
      - path-except: _test\.go
        linters:
          - forbidigo
      # Exclude known linters from partially hard-vendored code,
      # which is impossible to exclude via `nolint` comments.
      # `/` will be replaced by the current OS file path separator to properly work on Windows.
      - path: internal/hmac/
        text: "weak cryptographic primitive"
        linters:
          - gosec
      # Exclude some `staticcheck` messages.
      - linters:
          - staticcheck
        text: "SA9003:"
      # Exclude `lll` issues for long lines with `go:generate`.
      - linters:
          - lll
        source: "^//go:generate "
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
    - golines
    - swaggo
  exclusions:
    warn-unused: true
    generated: strict
    paths:
      - "docs"
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  fix: true
output:
  show-stats: true
run:
  timeout: 5m
  relative-path-mode: gomod
  issues-exit-code: 2
  tests: false
  modules-download-mode: vendor
