apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "app.fullname" . }}-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http
        protocol: HTTP
      hosts:
        - "cerberus.local"
