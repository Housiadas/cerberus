apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: {{ include "grafana.fullname" . }}-gateway
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "grafana.labels" . | nindent 4 }}
spec:
  selector:
    istio: ingressgateway
  servers:
    - port:
        number: 80
        name: http-grafana
        protocol: HTTP
      hosts:
        - "grafana.cerberus.local"
