apiVersion: v1
kind: Service
metadata:
  name: {{ include "tempo.fullname" . }}
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "tempo.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.service.httpPort }}
      targetPort: {{ .Values.service.httpPort }}
      protocol: TCP
      name: http
    - port: {{ .Values.service.otlpGrpcPort }}
      targetPort: {{ .Values.service.otlpGrpcPort }}
      protocol: TCP
      name: grpc-otlp
    - port: {{ .Values.service.otlpHttpPort }}
      targetPort: {{ .Values.service.otlpHttpPort }}
      protocol: TCP
      name: http-otlp
  selector:
    {{- include "tempo.selectorLabels" . | nindent 4 }}
