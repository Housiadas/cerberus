networks:
  app_local_network:

volumes:
  db_data:
  kafka_data:
  redis_data:
  tempo_data:
  vault_data:
  elasticsearch_data:

services:
  db:
    image: postgres:17.5
    container_name: db-container
    restart: always
    environment:
      POSTGRES_DB: "housi_db"
      POSTGRES_USER: "housi"
      POSTGRES_PASSWORD: "secret123"
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - app_local_network

  redis:
    image: redis:7.4
    container_name: redis-container
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - app_local_network

  kafka:
    image: confluentinc/cp-kafka:7.9.0
    container_name: kafka-container
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092'
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,PLAINTEXT_HOST://0.0.0.0:9092'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - app_local_network

  vault:
    image: hashicorp/vault:1.21
    container_name: vault-container
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: "dev-root-token"
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/data
      - .docker/vault/init.sh:/vault/init.sh:ro
    entrypoint: /bin/sh
    command: >
      -c "vault server -dev -dev-root-token-id=dev-root-token &
      sleep 2 && sh /vault/init.sh && wait"
    networks:
      - app_local_network

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=true
      - xpack.security.transport.ssl.enabled=false
      - ELASTIC_USERNAME=elastic
      - ELASTIC_PASSWORD=secret123
    ports:
      - "9200:9200"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    networks:
      - app_local_network

  migrate:
    container_name: migrate-container
    build:
      args:
        UID: "${UID:-1000}"
        GID: "${GID:-1000}"
      context: .
      dockerfile: .docker/migrate/Dockerfile
    volumes:
      - .:/app
    networks:
      - app_local_network

  ## ================== #
  ## Observability
  ## ================== #
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.147.0
    container_name: otel-collector-container
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - .docker/collector/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC (app connects here)
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Collector self-metrics
    depends_on:
      - tempo
      - prometheus
    networks:
      - app_local_network

  tempo:
    image: grafana/tempo:latest
    container_name: tempo-container
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - .docker/tempo/tempo.yaml:/etc/tempo.yaml
      - tempo_data:/var/tempo
    ports:
      - "3200:3200"   # tempo HTTP API
      - "14268:14268" # jaeger ingest
      - "9411:9411"   # zipkin
    expose:
      - "4317"        # OTLP gRPC (internal, reached by otel-collector)
      - "4318"        # OTLP HTTP (internal)
    networks:
      - app_local_network

  prometheus:
    image: prom/prometheus:v2.55.0
    container_name: prometheus-container
    volumes:
      - .docker/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"   # Prometheus UI
    networks:
      - app_local_network

  grafana:
    image: grafana/grafana:11.6.0
    container_name: grafana-container
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - .docker/grafana/datasources:/etc/grafana/provisioning/datasources
      - .docker/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards
      - .docker/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    networks:
      - app_local_network
