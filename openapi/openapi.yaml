      operationId: listSubscriptions
      tags: [Billing]
      summary: List subscriptions
      description: List subscriptions for an account
      security:
        - BearerAuth: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Subscriptions list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SubscriptionResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/billing/invoices:
    get:
      operationId: listInvoices
      tags: [Billing]
      summary: List invoices
      description: List invoices for an account
      security:
        - BearerAuth: []
      parameters:
        - name: account_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invoices list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InvoiceResponse'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /webhooks/stripe:
    post:
      operationId: stripeWebhook
      tags: [Webhooks]
      summary: Stripe webhook
      description: Handle Stripe webhook events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Webhook processed
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---- Audits ----
  /api/v1/audits:
    get:
      operationId: listAudits
      tags: [Audits]
      summary: List audits
      description: Search audits based on criteria
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: orderBy
          in: query
          schema:
            type: string
        - name: obj_id
          in: query
          schema:
            type: string
        - name: obj_domain
          in: query
          schema:
            type: string
        - name: obj_name
          in: query
          schema:
            type: string
        - name: actor_id
          in: query
          schema:
            type: string
        - name: action
          in: query
          schema:
            type: string
        - name: since
          in: query
          schema:
            type: string
        - name: until
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Audits list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPageResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer

  responses:
    ErrorResponse:
      description: Error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    # ---- System ----
    Status:
      type: object
      required: [status]
      properties:
        status:
          type: string

    Info:
      type: object
      required: [status, build, host, name, podIp, node, namespace, gomaxprocs]
      properties:
        status:
          type: string
        build:
          type: string
        host:
          type: string
        name:
          type: string
        podIp:
          type: string
        node:
          type: string
        namespace:
          type: string
        gomaxprocs:
          type: integer

    # ---- Auth ----
    LoginReq:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    RefreshTokenReq:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    LogoutReq:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string

    ForgotPasswordReq:
      type: object
      required: [email]
      properties:
        email:
          type: string

    ResetPasswordReq:
      type: object
      required: [token, oldPassword, password, passwordConfirm]
      properties:
        token:
          type: string
        oldPassword:
          type: string
        password:
          type: string
        passwordConfirm:
          type: string

    Token:
      type: object
      required: [accessToken, refreshToken, expiresIn]
      properties:
        accessToken:
          type: string
        refreshToken:
          type: string
        expiresIn:
          type: integer
          format: int64

    # ---- Users ----
    NewUser:
      type: object
      required: [name, email, password, passwordConfirm]
      properties:
        name:
          type: string
        email:
          type: string
        department:
          type: string
        password:
          type: string
        passwordConfirm:
          type: string

    UpdateUser:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        department:
          type: string
        password:
          type: string
        passwordConfirm:
          type: string
        enabled:
          type: boolean

    UpdateMe:
      type: object
      properties:
        name:
          type: string
