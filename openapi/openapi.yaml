openapi: "3.0.3"
info:
  title: Cerberus
  description: Cerberus backend system
  version: "1.0.0"
  contact:
    name: API Support
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html

servers:
  - url: http://localhost:4000
    description: Local development

security: []

paths:
  # ---- System ----
  /readiness:
    get:
      operationId: readiness
      tags: [System]
      summary: Readiness check
      description: Checks if the database is ready
      responses:
        '200':
          description: Service is ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Status'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /liveness:
    get:
      operationId: liveness
      tags: [System]
      summary: Liveness check
      description: Returns service status info
      responses:
        '200':
          description: Service is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---- Auth ----
  /api/v1/auth/login:
    post:
      operationId: authLogin
      tags: [Auth]
      summary: Login
      description: Validate user's credentials
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginReq'
      responses:
        '200':
          description: Successful login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/register:
    post:
      operationId: authRegister
      tags: [Auth]
      summary: Register
      description: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: User registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/refresh:
    post:
      operationId: authRefresh
      tags: [Auth]
      summary: Refresh token
      description: Refresh JWT tokens
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshTokenReq'
      responses:
        '200':
          description: Tokens refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Token'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/logout:
    post:
      operationId: authLogout
      tags: [Auth]
      summary: Logout
      description: Logout a user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutReq'
      responses:
        '204':
          description: Logged out
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/forgot-password:
    post:
      operationId: authForgotPassword
      tags: [Auth]
      summary: Forgot password
      description: Initiates the password reset flow by sending an email with a reset link
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordReq'
      responses:
        '204':
          description: Reset email sent (or silently ignored if email not found)
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/auth/reset-password:
    post:
      operationId: authResetPassword
      tags: [Auth]
      summary: Reset password
      description: Resets the user password using a valid reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordReq'
      responses:
        '204':
          description: Password reset successfully
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---- Users (Self-Service) ----
  /api/v1/users/me:
    get:
      operationId: getMe
      tags: [Users]
      summary: Get current user
      description: Get the authenticated user's own profile
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/ErrorResponse'

    put:
      operationId: updateMe
      tags: [Users]
      summary: Update current user
      description: Update the authenticated user's own profile
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMe'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---- Users ----
  /api/v1/users:
    get:
      operationId: listUsers
      tags: [Users]
      summary: List users
      description: Search users based on criteria
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: orderBy
          in: query
          schema:
            type: string
        - name: user_id
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: start_created_date
          in: query
          schema:
            type: string
        - name: end_created_date
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Users list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPageResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      operationId: createUser
      tags: [Users]
      summary: Create user
      description: Create a new user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewUser'
      responses:
        '200':
          description: User created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/users/search:
    get:
      operationId: searchUsers
      tags: [Users]
      summary: Search users
      description: Full-text search users via Elasticsearch
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          description: Free-text search query (matches name)
          schema:
            type: string
        - name: email
          in: query
          schema:
            type: string
        - name: department
          in: query
          schema:
            type: string
        - name: enabled
          in: query
          schema:
            type: string
        - name: start_created_date
          in: query
          schema:
            type: string
        - name: end_created_date
          in: query
          schema:
            type: string
        - name: sort
          in: query
          description: "Sort field and direction (e.g., name.keyword:asc, createdAt:desc)"
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: search_after
          in: query
          description: Opaque pagination token from previous response
          schema:
            type: string
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSearchResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/users/{user_id}:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getUser
      tags: [Users]
      summary: Get user
      description: Get user by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/ErrorResponse'

    put:
      operationId: updateUser
      tags: [Users]
      summary: Update user
      description: Update an existing user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      operationId: deleteUser
      tags: [Users]
      summary: Delete user
      description: Delete a user
      security:
        - BearerAuth: []
      responses:
        '204':
          description: User deleted
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/users/{user_id}/role:
    parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: createUserRole
      tags: [Users]
      summary: Add role to user
      description: Add a role to a user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserRoleReq'
      responses:
        '204':
          description: Role added
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      operationId: deleteUserRole
      tags: [Users]
      summary: Remove role from user
      description: Remove a role from a user
      security:
        - BearerAuth: []
      parameters:
        - name: role_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Role removed
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---- Roles ----
  /api/v1/roles:
    get:
      operationId: listRoles
      tags: [Roles]
      summary: List roles
      description: Search roles
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: orderBy
          in: query
          schema:
            type: string
        - name: role_id
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Roles list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePageResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      operationId: createRole
      tags: [Roles]
      summary: Create role
      description: Create a new role
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewRole'
      responses:
        '200':
          description: Role created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/roles/{role_id}:
    parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string

    put:
      operationId: updateRole
      tags: [Roles]
      summary: Update role
      description: Update an existing role
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRole'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      operationId: deleteRole
      tags: [Roles]
      summary: Delete role
      description: Delete a role
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Role deleted
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/roles/{role_id}/permission:
    parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: string

    post:
      operationId: createRolePermission
      tags: [Roles]
      summary: Add permission to role
      description: Add a permission to a role
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRolePermissionReq'
      responses:
        '204':
          description: Permission added
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      operationId: deleteRolePermission
      tags: [Roles]
      summary: Remove permission from role
      description: Remove a permission from a role
      security:
        - BearerAuth: []
      parameters:
        - name: permission_id
          in: query
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Permission removed
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---- Permissions ----
  /api/v1/permissions:
    get:
      operationId: listPermissions
      tags: [Permissions]
      summary: List permissions
      description: Search permissions
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: orderBy
          in: query
          schema:
            type: string
        - name: permission_id
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Permissions list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PermissionPageResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

    post:
      operationId: createPermission
      tags: [Permissions]
      summary: Create permission
      description: Create a new permission
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPermission'
      responses:
        '200':
          description: Permission created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/permissions/{permission_id}:
    parameters:
      - name: permission_id
        in: path
        required: true
        schema:
          type: string

    put:
      operationId: updatePermission
      tags: [Permissions]
      summary: Update permission
      description: Update an existing permission
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermission'
      responses:
        '200':
          description: Permission updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Permission'
        default:
          $ref: '#/components/responses/ErrorResponse'

    delete:
      operationId: deletePermission
      tags: [Permissions]
      summary: Delete permission
      description: Delete a permission
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Permission deleted
        default:
          $ref: '#/components/responses/ErrorResponse'

  # ---- Accounts ----
  /api/v1/accounts:
    post:
      operationId: createAccount
      tags: [Accounts]
      summary: Create account
      description: Create a new account with Stripe customer
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewAccount'
      responses:
        '200':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Account'
        default:
          $ref: '#/components/responses/ErrorResponse'

    get:
      operationId: listAccounts
      tags: [Accounts]
      summary: List accounts
      description: Search accounts
      security:
        - BearerAuth: []
      parameters:
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: string
        - name: orderBy
          in: query
          schema:
            type: string
        - name: account_id
          in: query
          schema:
            type: string
        - name: name
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Accounts list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountPageResult'
        default:
          $ref: '#/components/responses/ErrorResponse'

  /api/v1/accounts/{account_id}:
    parameters:
      - name: account_id
        in: path
        required: true
        schema:
          type: string

    get:
      operationId: getAccount
      tags: [Accounts]
      summary: Get account
      description: Get account by ID
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Account found
          content:
            application/json:
