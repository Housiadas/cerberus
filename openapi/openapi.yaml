  # ---- Billing ----
  /api/v1/billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [Billing]
      summary: Create checkout session
      description: Create a Stripe Checkout session
      security:
        - BearerAuth: []
      requestBody:
